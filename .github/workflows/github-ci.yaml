
name: Python CI Pipeline

on:
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check

  ruff-format:
    name: Ruff Format
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run ruff format --check

  ty:
    name: Type Checking
    needs: [ruff, ruff-format]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run ty check

  pytest:
    name: Pytest
    needs: ty
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - run: uv run pytest
